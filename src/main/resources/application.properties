# Carga el archivo .env de la raíz (si no existe, no falla)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Era "spring.port", que no existe. La propiedad correcta es server.port
server.port=${SERVER_PORT}

spring.jpa.hibernate.ddl-auto=update

# Donde guardar las imágenes
app.upload.dir=${UPLOAD_DIR}

# Access Key del formulario de contacto (se define en .env)
web3forms.access-key=${WEB3FORMS_ACCESS_KEY:}

# Límite de subida de archivos (imágenes de mascotas)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.forward-headers-strategy=framework
# Para recargar Thymeleaf
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true

