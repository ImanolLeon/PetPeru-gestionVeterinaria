<!DOCTYPE html>
<!-- ============================================================================
     PÁGINA DE INICIO DE SESIÓN · "Colita feliz"
     Página autónoma (NO usa layout/base.html: sin sidebar ni topbar).
     Spring Security la muestra en /login; el POST lo procesa el filtro
     UsernamePasswordAuthenticationFilter (ver HttpSecurityConfig).
     ============================================================================ -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Colita feliz</title>

    <!-- Favicon: recortes de static/img/logo.png (16/32/180 px) -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/apple-touch-icon.png}">
    <link rel="shortcut icon" th:href="@{/img/favicon-32.png}">

    <!-- Tipografía Inter (misma que el dashboard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="login-body">

<!-- ===================== Decoración de fondo (huellas + manchas) ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="shape-paw" viewBox="0 0 100 100">
        <ellipse cx="26" cy="32" rx="9" ry="11.5"/>
        <ellipse cx="42" cy="20" rx="9" ry="11.5"/>
        <ellipse cx="58" cy="20" rx="9" ry="11.5"/>
        <ellipse cx="74" cy="32" rx="9" ry="11.5"/>
        <path d="M50 40c12 0 24 10 24 21 0 10-10 16-24 16s-24-6-24-16c0-11 12-21 24-21Z"/>
    </symbol>
</svg>

<div class="login-deco" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>

    <svg class="paw paw--1"><use href="#shape-paw"/></svg>
    <svg class="paw paw--2"><use href="#shape-paw"/></svg>
    <svg class="paw paw--3"><use href="#shape-paw"/></svg>
    <svg class="paw paw--4"><use href="#shape-paw"/></svg>
</div>

<!-- ==================================== TARJETA ==================================== -->
<main class="login-card">

    <!-- Marca -->
    <div class="brand">
        <!-- Logo de la aplicación (static/img/logo.png · 447x447, círculo teal, fondo transparente) -->
        <img class="brand__logo" th:src="@{/img/logo.png}" alt="Colita feliz" width="66" height="66">

        <h1 class="brand__name">Colita feliz</h1>
        <p class="brand__subtitle">Sistema de Gestión Veterinaria</p>
    </div>

    <!-- Mensajes de estado -->
    <div class="alert alert--error" role="alert" th:if="${param.error}">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Usuario o contraseña incorrectos.
    </div>

    <div class="alert alert--ok" role="status" th:if="${param.logout}">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8"/></svg>
        Has cerrado la sesión correctamente.
    </div>

    <!-- Formulario -->
    <form class="login-form" th:action="@{/login}" method="post" novalidate>

        <div class="field">
            <label class="field__label" for="username">Usuario</label>
            <div class="control">
                <svg class="control__icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>
                </svg>
                <input id="username" name="username" type="text" placeholder="tu_usuario"
                       autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
            </div>
        </div>

        <div class="field">
            <label class="field__label" for="password">Contraseña</label>
            <div class="control control--password">
                <svg class="control__icon" viewBox="0 0 24 24">
                    <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
                    <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
                </svg>
                <input id="password" name="password" type="password" placeholder="••••••••"
                       autocomplete="current-password" required>

                <button class="toggle" id="togglePassword" type="button"
                        aria-label="Mostrar contraseña" aria-pressed="false">
                    <svg class="icon icon-eye" viewBox="0 0 24 24">
                        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon icon-off" viewBox="0 0 24 24">
                        <path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 5.1-5.9"/>
                        <path d="M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2"/>
                        <path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/>
                        <path d="M2 2l20 20"/>
                    </svg>
                </button>
            </div>
        </div>

        <button class="btn-login" type="submit">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M15 3h3.5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H15"/>
                <path d="m10 16.5 4.5-4.5L10 7.5"/><path d="M14.5 12H3.5"/>
            </svg>
            Iniciar sesión
        </button>
    </form>

    <p class="login-hint">
        ¿Necesitas una cuenta? Solicita acceso al administrador del sistema.
    </p>
</main>

<!-- Acceso de configuración / recuperación -->
<button class="config-fab" type="button"
        title="Configuración y recuperación de acceso"
        aria-label="Configuración y recuperación de acceso">
    <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px">
        <circle cx="7.5" cy="15.5" r="4.5"/>
        <path d="m10.8 12.2 8-8M16.5 4.5l3 3M14 7l3 3"/>
    </svg>
</button>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
