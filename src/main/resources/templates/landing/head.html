<th:block th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clínica veterinaria Pet'Salud</title>
    <meta name="description"
          content="Clínica veterinaria con atención de excelente nivel y precios accesibles. Pide cita, conoce nuestros servicios y encuéntranos.">

    <!-- Favicon: recortes de static/img/logo2.png (16/32/180 px) -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/apple-touch-icon.png}">
    <link rel="shortcut icon" th:href="@{/img/favicon-32.png}">

    <!-- Google Fonts: Oswald (titulares) + Open Sans (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS de la landing: un archivo por fragmento (ver static/CSS/landing/).
         El orden importa: base.css va primero (define los tokens) y los
         demás siguen el orden de las secciones en la página. -->
    <link rel="stylesheet" th:href="@{/css/landing/base.css}">
    <link rel="stylesheet" th:href="@{/css/landing/header.css}">
    <link rel="stylesheet" th:href="@{/css/landing/hero.css}">
    <link rel="stylesheet" th:href="@{/css/landing/servicios.css}">
    <link rel="stylesheet" th:href="@{/css/landing/pacientes.css}">
    <link rel="stylesheet" th:href="@{/css/landing/contacto.css}">
    <link rel="stylesheet" th:href="@{/css/landing/ubicacion.css}">
    <link rel="stylesheet" th:href="@{/css/landing/footer.css}">
    <noscript>
        <!-- Sin JS la foto del hero debe verse igual -->
        <style>.hero__photo img { opacity: 1 !important; }</style>
    </noscript>
</th:block>
